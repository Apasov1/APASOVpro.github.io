<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Donate</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6441A5, #9146FF);
    font-family: Arial, sans-serif;
  }
  .btn {
    background: #ffffff;
    color: #9146FF;
    border: none;
    padding: 20px 50px;
    font-size: 30px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<button class="btn" onclick="openDonate()">Donate</button>
<script>
function openDonate() {
  var popup = window.open("", "donate","width=550,height=780");
  popup.document.write('<iframe src="https://www.donationalerts.com/r/APASOV_pro/embed" width="100%" height="100%" frameborder="0" style="border:none;overflow:hidden;"></iframe>');
}
</script>
</body>
</html>
